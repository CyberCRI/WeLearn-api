ingress:
  hostname: api.welearn.k8s.lp-i.dev

config:
  nonSensitive:
    PG_HOST: dev-lab-projects-backend.postgres.database.azure.com
    TIKA_URL_BASE: https://tika.k8s.lp-i.dev/
    DATA_COLLECTION_ORIGIN_PREFIX: welearn
    SESSION_COOKIE_DOMAIN: .lp-i.dev
    LANGSMITH_TRACING_ENABLED: "true"
    LANGSMITH_PROJECT: WeLearn_Dev
    LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
    KEYCLOAK_URL: https://keycloak.k8s.lp-i.dev/
    KEYCLOAK_CLIENT_ID: welearn-dev
    KEYCLOAK_REALM: lp
    ENV: development
allowedHostsRegexes:
  mainUrl: |-
    https:\/\/welearn\.k8s\.lp-i\.dev

rateLimiting:
  enabled: true
