ingress:
  hostname: api.welearn.k8s.lp-i.xyz

config:
  nonSensitive:
    QDRANT_HOST: "http://stag-qdrant.stag-qdrant"
    QDRANT_PORT: "6333"
    PG_HOST: dev-lab-projects-backend.postgres.database.azure.com
    PG_USER: welearn_datastack_staging
    PG_DATABASE: welearn_datastack_staging
    TIKA_URL_BASE: https://tika.k8s.lp-i.dev/
    DATA_COLLECTION_ORIGIN_PREFIX: welearn
    SESSION_COOKIE_DOMAIN: .lp-i.xyz
    ENV: staging
    LANGSMITH_TRACING_ENABLED: "true"
    LANGSMITH_PROJECT: WeLearn_Staging
    LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
    # uvicorn reads X-Forwarded-For only from the Traefik pods (same CIDR as dev)
    FORWARDED_ALLOW_IPS: "10.244.0.0/16"
allowedHostsRegexes:
  mainUrl: |-
    https:\/\/welearn\.k8s\.lp-i\.xyz

rateLimiting:
  enabled: true
