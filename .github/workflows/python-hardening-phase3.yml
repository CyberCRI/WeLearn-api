name: Python Hardening (Phase 3)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "upgrade-python-version"

concurrency:
  group: phase3-python-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    name: py3.14 hardening
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Poetry
        run: pip install poetry==1.8.2

      - name: Configure Poetry environment
        run: |
          poetry config virtualenvs.in-project true
          poetry env use python

      - name: Install dependencies
        run: poetry install --no-interaction --with dev --without metrics

      - name: Import smoke checks
        run: |
          poetry run python - <<'PY'
          import importlib
          import warnings

          warnings.filterwarnings("error", category=DeprecationWarning, module=r"^src\\.")
          warnings.filterwarnings("error", category=RuntimeWarning, module=r"^src\\.")

          modules = [
              "src.main",
              "src.app.api.api_v1.endpoints.chat",
              "src.app.api.api_v1.endpoints.search",
              "src.app.shared.infra.abst_chat",
              "src.app.search.services.search",
              "src.app.tutor.api.router",
          ]

          for module_name in modules:
              importlib.import_module(module_name)
              print(f"import_ok={module_name}")
          PY

      - name: Critical path tests with strict runtime warnings
        run: |
          poetry run pytest -q \
            src/app/tests/api/api_v1/test_chat.py \
            src/app/tests/api/api_v1/test_search.py \
            src/app/tests/services/test_abst_chat.py \
            src/app/tests/services/test_search.py \
            src/app/tests/services/tutor/test_utils.py \
            -W error::RuntimeWarning:src\\.app\\..*
