name: CI

# Lint and tests run on every push, and so does the image build: a broken Dockerfile shows
# up in the PR, not after the merge. The image is pushed and deployed (<ref>_deploy tag)
# only for the refs below; on any other ref the build job reads "Build image only (no push)",
# the tag job is skipped and the run summary says why:
#   - main and tags (releases);
#   - a branch whose open PR carries the `preview` label. Adding the label triggers this
#     workflow through workflow_dispatch (see preview.yml), and later pushes redeploy;
#   - a manual run (workflow_dispatch) on any branch.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
      - "!**_deploy"
  workflow_dispatch:

# a new push cancels the run of the previous push. the run started by the `preview` label
# (workflow_dispatch) gets its own group: in a shared group, the push run it cancelled kept
# its reusable-workflow jobs waiting, and that waiting request cancelled the deploy run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # runs on the source, without registry credentials: Dependabot PRs get test results too
  lint-and-test:
    uses: ./.github/workflows/lint-and-test.yml

  # decides whether this ref pushes its image and gets a deploy tag
  deploy-target:
    name: Decide push and deploy
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          deploy=true
          if [ "$EVENT" = "workflow_dispatch" ]; then
            reason="manual run"
          elif [ "$REF_TYPE" = "tag" ]; then
            reason="release tag"
          elif [ "$REF_NAME" = "main" ]; then
            reason="main branch"
          else
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REF_NAME" --state open \
              --label preview --json number --jq '.[0].number // empty')
            if [ -n "$pr" ]; then
              reason="open PR #$pr has the preview label"
            else
              deploy=false
              reason="no open PR with the preview label"
            fi
          fi
          echo "deploy=$deploy" | tee -a "$GITHUB_OUTPUT"
          if [ "$deploy" = "true" ]; then
            echo "Image pushed and ${REF_NAME}_deploy tag created: $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Image built only, not pushed, no deploy tag: $reason" >> "$GITHUB_STEP_SUMMARY"
          fi

  # every push builds the image once the checks passed; only deploy targets push it.
  # the name says which: the inner job of the shared workflow is always called build-push
  build-docker:
    name: ${{ needs.deploy-target.outputs.deploy == 'true' && 'Build and push image' || 'Build image only (no push)' }}
    needs:
      - lint-and-test
      - deploy-target
    # Dependabot runs only get Dependabot secrets: no registry or submodule access
    if: github.actor != 'dependabot[bot]'
    uses: CyberCRI/github-workflows/.github/workflows/build-push.yaml@main
    with:
      registry-name: ${{ vars.DOCKER_PROD_REGISTRY }}
      image-name: welearn-api
      image-tag: ${{ github.sha }}
      # the version the API reports (GET / and the OpenAPI info): the release tag for a
      # tag build, the commit sha otherwise
      build-args: APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      recursive-submodule-checkout: true
      push: ${{ needs.deploy-target.outputs.deploy == 'true' }}
    secrets:
      submodules-app-private-key: ${{ secrets.INFRA_BOT_APP_PRIVATE_KEY }}
      submodules-app-id: ${{ secrets.INFRA_BOT_APP_ID }}
      submodules-app-installation-id: ${{ secrets.INFRA_BOT_APP_INSTALLATION_ID }}
      registry-username: ${{ secrets.DOCKER_PROD_USERNAME }}
      registry-password: ${{ secrets.DOCKER_PROD_PASSWORD }}

  tag-deploy:
    name: Create ${{ github.ref_name }}_deploy tag
    needs:
      - build-docker
      - lint-and-test
      - deploy-target
    # build-docker now runs on every push: only deploy targets get a deploy tag
    if: needs.deploy-target.outputs.deploy == 'true'
    uses: CyberCRI/github-workflows/.github/workflows/tag-deploy.yaml@main
