[tool.poetry]
name = "welearn-api"
version = "0.1.0"
description = ""
authors = ["Sandra Guerreiro <sandragjacinto@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
azure-core = "^1.38.0"
backoff = "^2.2.1"
ecologits = "^0.5.2"
fastapi = "^0.115.8"
jinja2 = "^3.1"
langdetect = "^1.0.9"
litellm = "^1.61.15"
psycopg2-binary = "^2.9.10"
pydantic = "^2.1.1"
pydantic-settings = "^2.0.3"
pylint-pydantic = "^0.2.4"
python-dotenv = "^1.0.0"
python-multipart = "^0.0.22"
qdrant-client = ">=1.16,<1.17"
requests = "^2.32.4"
scikit-learn = "^1.5.1"
sqlalchemy = "^2.0.35"
transformers="^4.50.0"
torch = [
    {version = "2.9.1+cpu", source = "pytorch_cpu", markers = "sys_platform == 'linux'"},
    {version = "2.9.1", source = "pypi", markers = "sys_platform == 'darwin'"},
]
torchvision = [
    {version = "0.24.1+cpu", source = "pytorch_cpu", markers = "sys_platform == 'linux'"},
    {version = "0.24.1", source = "pypi", markers = "sys_platform == 'darwin'"},
]
uvicorn = {extras = ["standard"], version = "^0.29.0"}
autogen-core = "^0.5.7"
autogen-ext = "^0.5.7"
autogen-agentchat = "^0.5.7"
pypdf = "^6.6.0"
numpy = "^2.1.0"
python-docx = "^1.1.2"
langchain-core = "^1.3.2"
langgraph-checkpoint-postgres = "^2.0.23"
azure-ai-inference = "^1.0.0b9"
azure-identity = "^1.25.0"
psycopg = {extras = ["binary"], version = "^3.2.10"}
welearn-database = "^1.5.4.dev1"
bs4 = "^0.0.2"
urllib3 = "^2.6.3"
refinedoc = "^1.0.1"
aiohttp = "^3.13.3"
httpx = "^0.28.1"
beautifulsoup4 = "^4.14.3"
json-repair = "^0.55.0"
langchain-mistralai = "^1.1.2"
langchain-azure-ai = "^1.2.3"
langgraph = "^1.1.10"
mistralai = "^2.4.3"
langsmith = "^0.10.11"
pandas = { version = "^3.0.3", markers = "python_version >= '3.11'" }
baml-py = "^0.226.1"
fastapi-mcp = "^0.4.0"
pyjwt = {extras = ["crypto"], version = "^2.10.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-env = "^1.0.1"
flake8 = "^6.1.0"
black = "^24.3.0"
isort = "^5.12.0"
import-linter = "^2.15"

[tool.poetry.group.metrics.dependencies]
locust = "^2.20.1"
ragas = ">=0.2.15"
langchain-community = ">=0.2.1"
prettytable = "^3.10.0"



[[tool.poetry.source]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
extend-exclude = "^/src/app/baml_client/"

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "shared does not import features"
type = "forbidden"
source_modules = ["src.app.shared"]
forbidden_modules = [
    "src.app.bibliography",
    "src.app.chat",
    "src.app.data_collection",
    "src.app.metric",
    "src.app.micro_learning",
    "src.app.search",
    "src.app.tutor",
    "src.app.user",
    "src.app.router",
]

[[tool.importlinter.contracts]]
name = "only the app router imports feature routers"
type = "forbidden"
source_modules = [
    "src.app.bibliography.domain",
    "src.app.bibliography.services",
    "src.app.chat.domain",
    "src.app.chat.services",
    "src.app.data_collection.infra",
    "src.app.data_collection.services",
    "src.app.metric.domain",
    "src.app.metric.infra",
    "src.app.micro_learning.infra",
    "src.app.micro_learning.services",
    "src.app.search.domain",
    "src.app.search.infra",
    "src.app.search.services",
    "src.app.tutor.domain",
    "src.app.tutor.services",
    "src.app.user.domain",
    "src.app.user.infra",
    "src.app.user.services",
    "src.app.shared",
    "src.app.core",
]
forbidden_modules = [
    "src.app.bibliography.api",
    "src.app.chat.api",
    "src.app.metric.api",
    "src.app.micro_learning.api",
    "src.app.search.api",
    "src.app.tutor.api",
    "src.app.user.api",
]

[[tool.importlinter.contracts]]
name = "feature routers are independent"
type = "independence"
modules = [
    "src.app.bibliography.api",
    "src.app.chat.api",
    "src.app.metric.api",
    "src.app.micro_learning.api",
    "src.app.search.api",
    "src.app.tutor.api",
    "src.app.user.api",
]
