[pytest]
# llm: prompt evaluations against the real model, run by `make eval-tutor` only
markers =
    llm: calls the real LLM, excluded by default
addopts = -m "not llm"
env =
    SESSION_COOKIE_DOMAIN=test.example.com
    CLIENT_ORIGINS=https://client.example.com
    LLM_TEMPERATURE=0.7
    MISTRAL_LLM_MODEL_NAME=mistral-small-latest
    MISTRAL_API_KEY=your_mistral_api_key
    PG_DATABASE=welearn
    PG_DRIVER=postgresql
    PG_HOST=localhost
    PG_PASSWORD=postgres
    PG_PORT=5432
    PG_USER=postgres
    QDRANT_HOST=https://qdrant.example.com
    QDRANT_PORT=6333
    RUN_ENV=development
    TIKA_URL_BASE=https://tika.example.com
    USE_CACHED_SETTINGS=True
    DATA_COLLECTION_ORIGIN_PREFIX=workshop
    ENV=test
    LANGSMITH_TRACING_ENABLED=false

filterwarnings =
    ignore:.*U.*mode is deprecated:DeprecationWarning
    # third-party, nothing to fix on our side: backoff (via litellm) is unmaintained
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff.*
    ignore:The `__get_pydantic_core_schema__` method of the `BaseModel` class is deprecated
